      <path d="M90 90h620"/><path d="M90 140h620"/><path d="M90 190h620"/><path d="M90 240h620"/><path d="M90 290h620"/><path d="M90 340h620"/><path d="M90 390h620"/><path d="M90 440h620"/><path d="M90 490h620"/><path d="M90 540h620"/><path d="M90 590h620"/><path d="M90 640h620"/><path d="M90 690h620"/><path d="M90 740h620"/><path d="M90 790h620"/><path d="M90 840h620"/>
    </g>
    <circle cx="400" cy="460" r="150" fill="none" stroke="#1e3a2f" stroke-width="2"/>
    <path d="M330 500V420l70-55 70 55v80z" fill="none" stroke="#1e3a2f" stroke-width="3"/>
    <path d="M370 500v-50h60v50" fill="none" stroke="#b4552d" stroke-width="3"/>
